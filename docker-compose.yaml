# This is to help debug Kafka- and Pulsar-related tests locally.
version: '3.8'
services:
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_CLIENT_PORT: 2181

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # Standalone Pulsar broker for debugging pulsar-sql-test / pulsar-cycle-test /
  # pulsar-long-stream-test locally. Exposes the broker (6650) and the admin/HTTP
  # API (8080) that PulsarSqlTest defaults to (127.0.0.1) when no -DpulsarIp is set.
  pulsar:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone
